<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" width="360" height="460">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="45%" stop-color="#f5d783"/>
      <stop offset="100%" stop-color="#8c6a1a"/>
    </linearGradient>
    <linearGradient id="bezel2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#6b5012"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="screen" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="80%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.45)"/>
      <stop offset="60%" stop-color="rgba(212,175,55,0.0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="180" cy="230" r="200" fill="url(#glow)"/>

  <!-- top strap -->
  <path d="M120 30 Q120 10 140 8 L220 8 Q240 10 240 30 L240 130 L120 130 Z" fill="url(#strap)"/>
  <!-- bottom strap -->
  <path d="M120 330 L240 330 L240 432 Q240 452 220 454 L140 454 Q120 452 120 432 Z" fill="url(#strap)"/>
  <!-- strap stitches -->
  <g stroke="rgba(212,175,55,0.35)" stroke-dasharray="3 4" stroke-width="1" fill="none">
    <path d="M132 30 L132 120"/>
    <path d="M228 30 L228 120"/>
    <path d="M132 340 L132 432"/>
    <path d="M228 340 L228 432"/>
  </g>

  <!-- side buttons -->
  <rect x="312" y="170" width="14" height="22" rx="3" fill="url(#bezel2)"/>
  <rect x="312" y="210" width="14" height="40" rx="3" fill="url(#bezel2)"/>
  <rect x="312" y="268" width="14" height="22" rx="3" fill="url(#bezel2)"/>
  <rect x="34" y="210" width="14" height="40" rx="3" fill="url(#bezel2)"/>

  <!-- watch case -->
  <circle cx="180" cy="230" r="135" fill="url(#bezel)"/>
  <circle cx="180" cy="230" r="125" fill="#0a0a0a"/>
  <circle cx="180" cy="230" r="120" fill="url(#bezel2)" opacity="0.85"/>
  <circle cx="180" cy="230" r="112" fill="url(#screen)"/>

  <!-- bezel ticks -->
  <g stroke="#f5d783" stroke-width="1.4" opacity="0.85">
    <line x1="180" y1="100" x2="180" y2="112"/>
    <line x1="180" y1="348" x2="180" y2="360"/>
    <line x1="50" y1="230" x2="62" y2="230"/>
    <line x1="298" y1="230" x2="310" y2="230"/>
  </g>
  <g stroke="#a08438" stroke-width="0.8" opacity="0.7">
    <line x1="245" y1="118" x2="240" y2="128"/>
    <line x1="115" y1="118" x2="120" y2="128"/>
    <line x1="245" y1="342" x2="240" y2="332"/>
    <line x1="115" y1="342" x2="120" y2="332"/>
  </g>

  <!-- screen content -->
  <g font-family="'Pretendard', Arial, sans-serif">
    <!-- top label -->
    <text x="180" y="170" text-anchor="middle" font-size="11" letter-spacing="2" fill="#d4af37" font-weight="700">DRIVE DIST.</text>
    <!-- big number -->
    <text x="180" y="240" text-anchor="middle" font-size="62" font-weight="900" fill="#f5d783">312</text>
    <text x="180" y="265" text-anchor="middle" font-size="14" letter-spacing="3" fill="#9a8f78">METERS</text>
    <!-- divider -->
    <line x1="120" y1="280" x2="240" y2="280" stroke="#3a3320" stroke-width="1"/>
    <!-- bottom row -->
    <text x="140" y="305" text-anchor="middle" font-size="10" letter-spacing="1" fill="#6f6655">CLUB</text>
    <text x="140" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#e8d999">DRIVER</text>
    <text x="220" y="305" text-anchor="middle" font-size="10" letter-spacing="1" fill="#6f6655">RANK</text>
    <text x="220" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#e8d999">#1</text>
  </g>

  <!-- screen reflection -->
  <ellipse cx="150" cy="170" rx="60" ry="22" fill="rgba(255,255,255,0.05)" filter="url(#soft)"/>

  <!-- GARMIN logo on bezel -->
  <text x="180" y="125" text-anchor="middle" font-size="9" letter-spacing="3" fill="#1a1200" font-weight="800" font-family="Arial, sans-serif">GARMIN</text>
</svg>
